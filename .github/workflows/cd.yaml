name: CD

on:
  push:
    branches:
      - main
      - develop
      - add-ci-cd-config
      - "feature/**"

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip image build validation and only tag/deploy"
        type: boolean
        default: false
      force_version:
        description: "Force specific version, without v prefix. Leave empty for auto-increment"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REQUIRED_RUNTIME_ENVS: DATABASE_CLIENT,DATABASE_FILENAME,DATABASE_SSL,DATABASE_SSL_REJECT_UNAUTHORIZED
  OPTIONAL_RUNTIME_ENVS: HOST

permissions:
  contents: read

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest SemVer tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST_TAG}"

      - name: Calculate next version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$FORCE_VERSION" ]; then
            NEW_VERSION="${FORCE_VERSION#v}"

            if ! echo "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::force_version must look like 1.2.3"
              exit 1
            fi

            IS_RELEASE="false"
            if [ "$EVENT_NAME" = "release" ]; then
              IS_RELEASE="true"
            fi

            echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
            echo "Forced version: ${NEW_VERSION}"
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            NEW_VERSION="${RELEASE_TAG#v}"

            if ! echo "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tag must look like 1.2.3"
              exit 1
            fi

            echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Release version: ${NEW_VERSION}"
            exit 0
          fi

          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION="${LATEST_TAG#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest tag is not a valid SemVer tag: ${LATEST_TAG}"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          COMMIT_MSG="$(git log -1 --pretty=%B)"

          if echo "$COMMIT_MSG" | grep -Eq '^feat(\(.+\))?!?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION}"

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: version
    if: github.event_name != 'release' && github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run --rm "${{ steps.image.outputs.image }}:test" node --version || true
          echo "Image built successfully"

  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [version, build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ env.APP_NAME }}
            org.opencontainers.image.description=SSM Next.js app
            ro.mtd.runtime-env.required=${{ env.REQUIRED_RUNTIME_ENVS }}
            ro.mtd.runtime-env.optional=${{ env.OPTIONAL_RUNTIME_ENVS }}
            ro.mtd.app.port=${{ env.APP_PORT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    name: Create Git Tag and Release
    runs-on: ubuntu-latest
    needs: [version, push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        env:
          RELEASE_BOT_NAME: ${{ vars.RELEASE_BOT_NAME }}
          RELEASE_BOT_EMAIL: ${{ vars.RELEASE_BOT_EMAIL }}
        run: |
          git config user.name "${RELEASE_BOT_NAME:-github-actions[bot]}"
          git config user.email "${RELEASE_BOT_EMAIL:-github-actions[bot]@users.noreply.github.com}"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "Tag ${VERSION} already exists remotely. Deleting and recreating..."
            git push origin --delete "${VERSION}" || true
          fi

          git tag -d "${VERSION}" 2>/dev/null || true
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          echo "Created tag: ${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release ${VERSION} already exists. Deleting and recreating..."
            gh release delete "${VERSION}" --yes --cleanup-tag=false
          fi

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          echo "Created GitHub Release: ${VERSION}"

