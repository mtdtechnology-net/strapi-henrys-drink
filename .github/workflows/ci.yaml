name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Strapi commands
        run: |
          npm run develop --if-present -- --help
          npm run start --if-present -- --help

      - name: Build Strapi admin panel
        run: npm run build

      - name: Verify deployment command
        run: |
          if npm run | grep -q "deploy"; then
            echo "Strapi deployment command available"
          else
            echo "No deployment script configured"
          fi

      - name: Extract branch name
        if: always()
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "build_status": "${{ job.status }}",
              "work_done": "Build & Sonar - branch ${{ steps.extract_branch.outputs.branch }}",
              "github_repository": "${{ github.repository }}",
              "github_pr_url": "${{ github.event.pull_request.html_url }}",
              "github_sha": "${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
